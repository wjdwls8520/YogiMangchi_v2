services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: yogimangchi
      POSTGRES_USER: ${YOGIMANGCHI_DB_USERNAME}
      POSTGRES_PASSWORD: ${YOGIMANGCHI_DB_PASSWORD}
    ports:
      - "127.0.0.1:${YOGIMANGCHI_DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${YOGIMANGCHI_REDIS_PORT}:6379"

volumes:
  postgres-data: