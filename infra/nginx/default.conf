# YogiMangchi V2 - Production Edge Reverse Proxy (Nginx 1.27 Alpine)
#
# Mounted at /etc/nginx/conf.d/default.conf inside the http {} block.
# Shared memory zones are sized at 2m each (~32k IPv4 states/zone, 12m total)
# to fit comfortably inside the 96m container memory budget on 1-2 GB EC2.

# Edge rate-limit & concurrent connection zones
limit_req_zone $binary_remote_addr zone=auth:2m rate=30r/m;
limit_req_zone $binary_remote_addr zone=write:2m rate=5r/s;
limit_req_zone $binary_remote_addr zone=public_api:2m rate=20r/s;
limit_req_zone $binary_remote_addr zone=candles:2m rate=10r/s;

limit_conn_zone $binary_remote_addr zone=sse_conn:2m;
limit_conn_zone $binary_remote_addr zone=ws_conn:2m;

limit_req_status 429;
limit_conn_status 429;

# WebSocket Upgrade connection helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    # Docker embedded DNS resolver so container restarts never pin stale IPs
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $content_upstream "http://content-server:8080";
    set $trading_upstream "http://trading-server:8081";

    # Default upload limit; multipart upload paths explicitly override to 55m
    client_max_body_size 2m;

    # Edge security headers (inherited by all locations without local add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy defaults & trusted forwarded header sanitization
    # Strip client-spoofed RFC 7239 Forwarded header so Spring only trusts Nginx.
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Forwarded "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # =========================================================================
    # Edge health & Certbot challenge
    # =========================================================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /actuator/health {
        access_log off;
        proxy_pass $content_upstream;
    }

    location ^~ /actuator/health/ {
        access_log off;
        proxy_pass $content_upstream;
    }

    # Uncomment when issuing Let's Encrypt certificates via webroot:
    # location ^~ /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # =========================================================================
    # Blocked internal / docs / metrics endpoints at edge
    # =========================================================================
    location ^~ /swagger-ui {
        return 404;
    }

    location = /swagger-ui.html {
        return 404;
    }

    location ^~ /v3/api-docs {
        return 404;
    }

    location ^~ /actuator/metrics {
        return 404;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    # =========================================================================
    # Trading Server - WebSockets (trading-server:8081)
    # =========================================================================
    location ^~ /ws/market {
        limit_conn ws_conn 10;

        proxy_pass $trading_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Repeat trusted forwarded headers because local proxy_set_header overrides server defaults
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /ws/trading {
        limit_conn ws_conn 10;

        proxy_pass $trading_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # =========================================================================
    # Trading Server - SSE Notification Streams (trading-server:8081)
    # =========================================================================
    location ^~ /api/v1/trading/notifications/stream {
        limit_conn sse_conn 5;

        proxy_pass $trading_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /api/v1/trading/notifications/subscribe {
        limit_conn sse_conn 5;

        proxy_pass $trading_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # =========================================================================
    # Trading Server - Rate-Limited & Core REST APIs (trading-server:8081)
    # =========================================================================
    location ^~ /api/v1/market/candles {
        limit_req zone=candles burst=25 nodelay;
        proxy_pass $trading_upstream;
    }

    location = /api/v1/trading/accounts/guest {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $trading_upstream;
    }

    location ^~ /api/v1/trading/account/orders {
        limit_req zone=write burst=20 nodelay;
        proxy_pass $trading_upstream;
    }

    location ^~ /api/v1/trading/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $trading_upstream;
    }

    location ^~ /api/v1/market/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $trading_upstream;
    }

    location ^~ /api/v1/symbols {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $trading_upstream;
    }

    # =========================================================================
    # Content Server - SSE Streams (content-server:8080)
    # =========================================================================
    location = /api/v1/news/stream {
        limit_conn sse_conn 5;

        proxy_pass $content_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /api/v1/community/ux/subscribe/ {
        limit_conn sse_conn 5;

        proxy_pass $content_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /api/v1/notifications/stream {
        limit_conn sse_conn 5;

        proxy_pass $content_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ^~ /api/v1/notifications/subscribe {
        limit_conn sse_conn 5;

        proxy_pass $content_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Connection "";
        proxy_set_header Forwarded "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # =========================================================================
    # Content Server - Auth & OAuth2 (content-server:8080)
    # =========================================================================
    location ^~ /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /oauth2/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /login/oauth2/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $content_upstream;
    }

    location = /.well-known/jwks.json {
        limit_req zone=public_api burst=20 nodelay;
        proxy_pass $content_upstream;
    }

    # =========================================================================
    # Content Server - Multipart Upload Paths (55m max request size)
    # =========================================================================
    location ^~ /api/v1/community/ {
        client_max_body_size 55m;
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /api/v1/members/ {
        client_max_body_size 55m;
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $content_upstream;
    }

    # =========================================================================
    # Content Server - Standard REST APIs (default 2m max request size)
    # =========================================================================
    location ^~ /api/v1/news {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /api/v1/policies/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /api/v1/notifications {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /api/v1/support/ {
        limit_req zone=write burst=15 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /api/v1/admin/ {
        limit_req zone=write burst=20 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /api/v1/ops/ {
        limit_req zone=write burst=10 nodelay;
        proxy_pass $content_upstream;
    }

    location ^~ /api/v1/report/ {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass $content_upstream;
    }

    # Deny all unmapped paths by default
    location / {
        return 404;
    }
}

# =============================================================================
# Optional $0 Let's Encrypt / Certbot HTTPS template (uncomment once certs exist
# on EC2 and port 443:443 is enabled in docker-compose.prod.yml):
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name api.yourdomain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_session_cache   shared:SSL:2m;
#     ssl_session_timeout 10m;
#
#     # Copy the server {} location blocks above (with X-Forwarded-Proto https)
#     # and redirect port 80 traffic to https://$host$request_uri.
# }
# =============================================================================
