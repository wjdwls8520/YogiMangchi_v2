spring:
  application:
    name: trading-server
  datasource:
    url: ${TRADING_DB_URL}
    username: ${TRADING_DB_USERNAME}
    password: ${TRADING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trading
  flyway:
    default-schema: trading
    schemas: trading
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  port: ${TRADING_SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

# Documentation is opt-in through the local profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
