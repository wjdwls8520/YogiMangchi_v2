spring:
  application:
    name: trading-server
  data:
    redis:
      host: ${YOGIMANGCHI_REDIS_HOST:localhost}
      port: ${YOGIMANGCHI_REDIS_PORT:6379}
      password: ${YOGIMANGCHI_REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:${YOGIMANGCHI_DB_PORT:5432}/yogimangchi
    username: ${YOGIMANGCHI_DB_USERNAME}
    password: ${YOGIMANGCHI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trading
  flyway:
    default-schema: trading
    schemas: trading
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: ${TRADING_SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

marketdata:
  websocket:
    allowed-origins: ${TRADING_WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

trading:
  http:
    allowed-origins: ${TRADING_HTTP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
