spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: trading-server
  data:
    redis:
      host: ${YOGIMANGCHI_REDIS_HOST:localhost}
      port: ${YOGIMANGCHI_REDIS_PORT:6379}
      password: ${YOGIMANGCHI_REDIS_PASSWORD:}
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:${YOGIMANGCHI_DB_PORT:5432}/yogimangchi
    username: ${YOGIMANGCHI_DB_USERNAME}
    password: ${YOGIMANGCHI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trading
  flyway:
    default-schema: trading
    schemas: trading
    clean-disabled: true
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: ${TRADING_SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

marketdata:
  clock:
    skew-check-enabled: ${MARKET_CLOCK_SKEW_CHECK_ENABLED:false}
    warning-threshold: ${MARKET_CLOCK_WARNING_THRESHOLD:12h}
    degraded-threshold: ${MARKET_CLOCK_DEGRADED_THRESHOLD:48h}
    reject-threshold: ${MARKET_CLOCK_REJECT_THRESHOLD:365d}
    max-receipt-future: ${MARKET_CLOCK_MAX_RECEIPT_FUTURE:5m}
  websocket:
    allowed-origins: ${TRADING_WS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  overview:
    enabled: ${MARKET_OVERVIEW_COLLECTOR_ENABLED:true}
    interval-ms: ${MARKET_OVERVIEW_INTERVAL_MS:5000}

binance:
  order-book:
    enabled: ${BINANCE_ORDER_BOOK_ENABLED:true}

trading:
  member-auth:
    enabled: ${TRADING_MEMBER_AUTH_ENABLED:false}
    issuer: ${YOGIMANGCHI_JWT_ISSUER:http://localhost:8080}
    public-key-path: ${TRADING_JWT_PUBLIC_KEY_PATH:}
  guest-cleanup:
    enabled: ${TRADING_GUEST_CLEANUP_ENABLED:true}
  trigger:
    enabled: ${TRADING_TRIGGER_ENABLED:true}
  risk:
    retention:
      enabled: ${TRADING_RISK_RETENTION_ENABLED:true}
      duration: ${TRADING_RISK_RETENTION_DURATION:PT72H}
      batch-size: ${TRADING_RISK_RETENTION_BATCH_SIZE:500}
      interval-ms: ${TRADING_RISK_RETENTION_INTERVAL_MS:3600000}
      initial-delay-ms: ${TRADING_RISK_RETENTION_INITIAL_DELAY_MS:120000}
  http:
    allowed-origins: ${TRADING_HTTP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
