# Local development only. Production must use independently provisioned DB roles.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: yogimangchi_trading
      POSTGRES_USER: ${TRADING_DB_USERNAME:?Set TRADING_DB_USERNAME}
      POSTGRES_PASSWORD: ${TRADING_DB_PASSWORD:?Set TRADING_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TRADING_DB_PORT:-5433}:5432"
    volumes:
      - trading-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trading-postgres-data:
