spring:
  datasource:
    url: ${CONTENT_DB_URL}
    username: ${CONTENT_DB_USERNAME}
    password: ${CONTENT_DB_PASSWORD}
  flyway:
    url: ${CONTENT_DB_URL}
    user: ${CONTENT_FLYWAY_USERNAME}
    password: ${CONTENT_FLYWAY_PASSWORD}
server:
  address: 0.0.0.0
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
content:
  withdrawal:
    delivery-enabled: ${CONTENT_WITHDRAWAL_DELIVERY_ENABLED:true}
    trading-base-url: ${CONTENT_TRADING_BASE_URL}
  auth:
    issuer: ${YOGIMANGCHI_JWT_ISSUER}
    frontend-return-uri: ${CONTENT_AUTH_RETURN_URI}
    allowed-origins: ${CONTENT_HTTP_ALLOWED_ORIGINS}
    secure-cookies: true
  oauth:
    enabled: ${CONTENT_OAUTH_ENABLED:true}
  s3:
    enabled: ${CONTENT_S3_ENABLED:false}
    public-base-url: ${CONTENT_S3_PUBLIC_BASE_URL:}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-northeast-2}
