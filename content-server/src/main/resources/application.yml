spring:
  application:
    name: content-server
  datasource:
    url: jdbc:postgresql://localhost:${YOGIMANGCHI_DB_PORT:5432}/yogimangchi
    username: ${YOGIMANGCHI_DB_USERNAME}
    password: ${YOGIMANGCHI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: content
  flyway:
    default-schema: content
    schemas: content
    clean-disabled: true
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  port: ${CONTENT_SERVER_PORT:8080}
  servlet:
    session:
      timeout: 10m
      cookie:
        name: CONTENT_SESSION
        http-only: true
        same-site: lax
        secure: false
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
content:
  withdrawal:
    delivery-enabled: ${CONTENT_WITHDRAWAL_DELIVERY_ENABLED:false}
    trading-base-url: ${CONTENT_TRADING_BASE_URL:http://localhost:8081}
  auth:
    nickname-lookups-per-minute: ${CONTENT_NICKNAME_LOOKUPS_PER_MINUTE:300}
    issuer: ${YOGIMANGCHI_JWT_ISSUER:http://localhost:8080}
    private-key-path: ${CONTENT_JWT_PRIVATE_KEY_PATH}
    key-id: ${CONTENT_JWT_KEY_ID:content-1}
    secure-cookies: false
    frontend-return-uri: ${CONTENT_AUTH_RETURN_URI:http://localhost:3000/auth/callback}
    allowed-origins: ${CONTENT_HTTP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  oauth:
    enabled: ${CONTENT_OAUTH_ENABLED:false}
