openapi: 3.1.0
info:
  title: Yogimangchi Trading API
  version: v1
servers:
- url: /
paths:
  /api/v1/symbols:
    get:
      tags:
      - trading-symbol-controller
      summary: 거래 가능한 종목 목록
      description: 인증 없이 ACTIVE 종목을 Symbol 오름차순으로 조회합니다. 종목이 없으면 빈 배열을 반환합니다.
      operationId: findActiveSymbols
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradingSymbolResponse"
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type:
          - string
          - "null"
        status:
          type: integer
          format: int32
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
    TradingSymbolResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Provider Symbol 변경과 무관하게 유지되는 내부 종목 ID
          example: 1
        symbol:
          type: string
          example: BTC
        name:
          type: string
          example: Bitcoin
        quoteAsset:
          type: string
          example: USDT
        displaySymbol:
          type: string
          description: 화면 표시용 거래쌍
          example: BTC / USDT
