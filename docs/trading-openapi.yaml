openapi: 3.1.0
info:
  title: Yogimangchi Trading API
  version: v1
servers:
- url: /
paths:
  /api/v1/trading/accounts/guest:
    post:
      tags:
      - trading-account-controller
      summary: Create a guest simulation account with 10000 USDT
      description: Returns a 7-day opaque bearer credential once. Losing it means
        losing access; never share or log it.
      operationId: createGuest
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestAccountResponse"
  /api/v1/trading/account/positions/{positionId}/close:
    post:
      tags:
      - order-controller
      summary: Close one entire owned position at the fresh server mark price
      description: "LONG closes by selling, SHORT by buying. All held symbols must\
        \ be fresh. Same idempotency contract as opening; 404 for another account's\
        \ position."
      operationId: close
      parameters:
      - name: positionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
      security:
      - guestBearer: []
  /api/v1/trading/account/orders:
    get:
      tags:
      - order-controller
      summary: "Read own order/fill history, newest first"
      description: "Use the last returned orderId as beforeId for the next page; limit\
        \ 1-100, default 50."
      operationId: history
      parameters:
      - name: beforeId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
      security:
      - guestBearer: []
    post:
      tags:
      - order-controller
      summary: Open a LONG or SHORT position at the fresh server mark price
      description: "Idempotency-Key: 8-100 letters, digits, underscore or hyphen.\
        \ Replay returns original result. 400 invalid request; 401 credential; 409\
        \ margin/risk/idempotency conflict; 503 unavailable price. No client execution\
        \ price."
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
        required: true
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
      security:
      - guestBearer: []
  /api/v1/trading/account/wallet:
    get:
      tags:
      - trading-account-controller
      summary: Read the authenticated guest's USDT wallet and current valuation
      description: "401: missing/expired credential; 409 TRADING_BUSY: retry after\
        \ lock contention; 503: authentication storage unavailable."
      operationId: wallet
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
      security:
      - guestBearer: []
  /api/v1/trading/account/summary:
    get:
      tags:
      - trading-account-controller
      summary: "Read a coherent account, wallet and open-position snapshot"
      description: "401: missing/expired credential; 409 TRADING_BUSY: retry after\
        \ lock contention; 503: authentication storage unavailable."
      operationId: summary
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryResponse"
      security:
      - guestBearer: []
  /api/v1/trading/account/positions:
    get:
      tags:
      - trading-account-controller
      summary: Read the authenticated guest's open position lots
      description: "401: missing/expired credential; 409 TRADING_BUSY: retry after\
        \ lock contention; 503: authentication storage unavailable."
      operationId: positions
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionResponse"
      security:
      - guestBearer: []
  /api/v1/symbols:
    get:
      tags:
      - trading-symbol-controller
      summary: 거래 가능한 종목 목록
      description: 인증 없이 ACTIVE 종목을 Symbol 오름차순으로 조회합니다. 종목이 없으면 빈 배열을 반환합니다.
      operationId: findActiveSymbols
      responses:
        "500":
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradingSymbolResponse"
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type:
          - string
          - "null"
        status:
          type: integer
          format: int32
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
    GuestAccountResponse:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
        status:
          type: string
        quoteAsset:
          type: string
        initialBalance:
          type: string
        accessToken:
          type: string
          description: "256-bit opaque guest credential. Returned once; send as Authorization:\
            \ Bearer <token>."
        tokenType:
          type: string
        expiresAt:
          type: string
          format: date-time
    FillResponse:
      type: object
      properties:
        fillId:
          type: integer
          format: int64
        price:
          type: string
        priceEventTime:
          type: string
          format: date-time
        executedAt:
          type: string
          format: date-time
        realizedPnl:
          type: string
    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        positionId:
          type: integer
          format: int64
        tradingSymbolId:
          type: integer
          format: int64
        type:
          type: string
        action:
          type: string
        side:
          type: string
        status:
          type: string
        quantity:
          type: string
        leverage:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        fill:
          $ref: "#/components/schemas/FillResponse"
    CreateOrderRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - MARKET
        tradingSymbolId:
          type: integer
          format: int64
        side:
          type: string
          enum:
          - LONG
          - SHORT
        quantity:
          type: string
          description: "Domain asset quantity, maximum 8 decimal places"
          example: "0.001"
        leverage:
          type: integer
          format: int32
    WalletResponse:
      type: object
      description: USDT amounts are decimal strings. Valuation-dependent fields are
        null when any open position price is unavailable.
      properties:
        quoteAsset:
          type: string
        balance:
          type: string
        usedMargin:
          type: string
        reservedMargin:
          type: string
        realizedPnl:
          type: string
        unrealizedPnl:
          type: string
        equity:
          type: string
        availableBalance:
          type: string
        valuationStatus:
          type: string
    AccountSummaryResponse:
      type: object
      properties:
        accountId:
          type: integer
          format: int64
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        wallet:
          $ref: "#/components/schemas/WalletResponse"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PositionResponse"
        valuedAt:
          type: string
          format: date-time
    PositionResponse:
      type: object
      description: Independent position lot in domain asset units. markPrice/unrealizedPnl
        are null unless the server price is FRESH.
      properties:
        id:
          type: integer
          format: int64
        tradingSymbolId:
          type: integer
          format: int64
        side:
          type: string
        quantity:
          type: string
        entryPrice:
          type: string
        leverage:
          type: integer
          format: int32
        margin:
          type: string
        status:
          type: string
        realizedPnl:
          type: string
        markPrice:
          type: string
        unrealizedPnl:
          type: string
        priceStatus:
          type: string
        priceEventTime:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
    TradingSymbolResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Provider Symbol 변경과 무관하게 유지되는 내부 종목 ID
          example: 1
        symbol:
          type: string
          example: BTC
        name:
          type: string
          example: Bitcoin
        quoteAsset:
          type: string
          example: USDT
        displaySymbol:
          type: string
          description: 화면 표시용 거래쌍
          example: BTC / USDT
  securitySchemes:
    guestBearer:
      type: http
      description: Opaque Guest Trading MVP credential; not a Content JWT. Issued
        by POST /api/v1/trading/accounts/guest.
      scheme: bearer
