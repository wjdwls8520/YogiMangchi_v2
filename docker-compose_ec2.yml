# ==============================================================================
# YogiMangchi V2 - EC2 All-in-One Production Docker Compose (CloudFront -> Nginx :80)
#
# 사용 방법 (EC2):
#   1. FileZilla로 이 파일을 EC2에 올린 뒤 `docker-compose.yml`로 이름 변경
#      (롤백을 위해 기존 v1의 `docker-compose.yml`, `.env`, `./nginx/nginx.conf`는
#       반드시 `*.v1.bak`으로 백업해 두세요!)
#   2. `./secrets/content-private.pem`, `./secrets/content-public.pem` 준비
#   3. `./nginx/nginx.conf`를 V2용 Nginx 설정으로 교체
#   4. AWS ECR 로그인 후 실행:
#        docker compose pull
#        docker compose up -d
#
# 롤백 안전 장치:
#   - DB 데이터 폴더를 `./data/db-v2`로 분리하여 기존 v1의 `./data/db`를 건드리지 않습니다.
#   - ECR 이미지 태그를 `:v2-content`, `:v2-trading`, `:v2`로 분리하여 v1 `:latest`를 보존합니다.
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. PostgreSQL 17 (V2 전용 데이터 디렉터리 `./data/db-v2` 사용 -> V1 `./data/db` 완전 보존)
  db:
    image: postgres:17.11-alpine
    container_name: yogimangchi-db-v2
    restart: unless-stopped
    mem_limit: 320m
    logging: *default-logging
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "max_connections=60"
      - "-c"
      - "work_mem=4MB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yogimangchi}
      POSTGRES_USER: ${POSTGRES_USER:-${YOGIMANGCHI_DB_USERNAME}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${YOGIMANGCHI_DB_PASSWORD}}
      TZ: Asia/Seoul
    volumes:
      - ./data/db-v2:/var/lib/postgresql/data
      - ./backups:/backups
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - yogimangchi-net

  # 2. Redis 캐시 / 시세 스트림
  redis:
    image: redis:7-alpine
    container_name: yogimangchi-redis-v2
    restart: unless-stopped
    mem_limit: 160m
    logging: *default-logging
    environment:
      YOGIMANGCHI_REDIS_PASSWORD: ${YOGIMANGCHI_REDIS_PASSWORD:-}
      TZ: Asia/Seoul
    command:
      - "sh"
      - "-c"
      - |
        if [ -n "$$YOGIMANGCHI_REDIS_PASSWORD" ]; then
          exec redis-server --appendonly no --save "" --maxmemory 96mb --maxmemory-policy volatile-lru --requirepass "$$YOGIMANGCHI_REDIS_PASSWORD"
        else
          exec redis-server --appendonly no --save "" --maxmemory 96mb --maxmemory-policy volatile-lru
        fi
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          if [ -n "$$YOGIMANGCHI_REDIS_PASSWORD" ]; then
            REDISCLI_AUTH="$$YOGIMANGCHI_REDIS_PASSWORD" redis-cli ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - yogimangchi-net

  # 3. Content Server (회원 · 인증 · 커뮤니티 · 뉴스 · 1:1 문의 · 관리자, 8080)
  content-server:
    image: ${CONTENT_IMAGE:-622532143961.dkr.ecr.ap-northeast-2.amazonaws.com/yogimangchi-server:v2-content}
    container_name: yogimangchi-content-server
    restart: unless-stopped
    mem_limit: 448m
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx224m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: "prod,file-log"
      SERVER_ADDRESS: "0.0.0.0"
      CONTENT_SERVER_PORT: "8080"
      LOGGING_FILE_NAME: "/var/log/yogimangchi/content-server.log"
      # PostgreSQL (기존 v1의 POSTGRES_* 또는 v2의 YOGIMANGCHI_DB_* 자동 호환)
      CONTENT_DB_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-yogimangchi}"
      CONTENT_DB_USERNAME: ${POSTGRES_USER:-${YOGIMANGCHI_DB_USERNAME}}
      CONTENT_DB_PASSWORD: ${POSTGRES_PASSWORD:-${YOGIMANGCHI_DB_PASSWORD}}
      CONTENT_FLYWAY_USERNAME: ${CONTENT_FLYWAY_USERNAME:-${POSTGRES_USER:-${YOGIMANGCHI_DB_USERNAME}}}
      CONTENT_FLYWAY_PASSWORD: ${CONTENT_FLYWAY_PASSWORD:-${POSTGRES_PASSWORD:-${YOGIMANGCHI_DB_PASSWORD}}}
      YOGIMANGCHI_DB_USERNAME: ${POSTGRES_USER:-${YOGIMANGCHI_DB_USERNAME}}
      YOGIMANGCHI_DB_PASSWORD: ${POSTGRES_PASSWORD:-${YOGIMANGCHI_DB_PASSWORD}}
      # 서버 간 내부 통신 & 도메인/CORS/OAuth (https://yogimangchi.com 기준)
      CONTENT_TRADING_BASE_URL: "http://trading-server:8081"
      CONTENT_WITHDRAWAL_DELIVERY_ENABLED: ${CONTENT_WITHDRAWAL_DELIVERY_ENABLED:-true}
      YOGIMANGCHI_JWT_ISSUER: ${YOGIMANGCHI_JWT_ISSUER:-https://yogimangchi.com}
      CONTENT_JWT_PRIVATE_KEY_PATH: "/run/secrets/content-private.pem"
      CONTENT_JWT_KEY_ID: ${CONTENT_JWT_KEY_ID:-content-1}
      CONTENT_AUTH_RETURN_URI: ${CONTENT_AUTH_RETURN_URI:-https://yogimangchi.com/auth/callback}
      CONTENT_HTTP_ALLOWED_ORIGINS: ${CONTENT_HTTP_ALLOWED_ORIGINS:-https://yogimangchi.com,https://www.yogimangchi.com}
      CONTENT_OAUTH_ENABLED: ${CONTENT_OAUTH_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      # 이미지 저장소 (기존 AWS S3 그대로 사용 가능; S3 끄면 ./data/uploads-v2 영구 디스크 사용)
      CONTENT_S3_ENABLED: ${CONTENT_S3_ENABLED:-true}
      CONTENT_PUBLIC_BASE_URL: ${CONTENT_PUBLIC_BASE_URL:-https://yogimangchi.com}
      CONTENT_LOCAL_MEDIA_DIR: "/var/lib/yogimangchi/uploads"
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS: ${S3_ACCESS:-}
      S3_SECRET: ${S3_SECRET:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      # 선택 운영 웹훅 알림 (비워두면 꺼짐 · 0원)
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_COOLDOWN_SECONDS: ${OPS_ALERT_COOLDOWN_SECONDS:-300}
      OPS_ALERT_TELEGRAM_CHAT_ID: ${OPS_ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./secrets:/run/secrets:ro
      - ./data/uploads-v2:/var/lib/yogimangchi/uploads
      - ./logs/content:/var/log/yogimangchi
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - yogimangchi-net

  # 4. Trading Server (모의투자 엔진 · 시세 WebSocket · 대회, 8081)
  trading-server:
    image: ${TRADING_IMAGE:-622532143961.dkr.ecr.ap-northeast-2.amazonaws.com/yogimangchi-server:v2-trading}
    container_name: yogimangchi-trading-server
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: "prod,file-log"
      SERVER_ADDRESS: "0.0.0.0"
      TRADING_SERVER_PORT: "8081"
      LOGGING_FILE_NAME: "/var/log/yogimangchi/trading-server.log"
      # PostgreSQL & Redis
      TRADING_DB_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-yogimangchi}"
      TRADING_DB_USERNAME: ${POSTGRES_USER:-${YOGIMANGCHI_DB_USERNAME}}
      TRADING_DB_PASSWORD: ${POSTGRES_PASSWORD:-${YOGIMANGCHI_DB_PASSWORD}}
      TRADING_FLYWAY_USERNAME: ${TRADING_FLYWAY_USERNAME:-${POSTGRES_USER:-${YOGIMANGCHI_DB_USERNAME}}}
      TRADING_FLYWAY_PASSWORD: ${TRADING_FLYWAY_PASSWORD:-${POSTGRES_PASSWORD:-${YOGIMANGCHI_DB_PASSWORD}}}
      YOGIMANGCHI_DB_USERNAME: ${POSTGRES_USER:-${YOGIMANGCHI_DB_USERNAME}}
      YOGIMANGCHI_DB_PASSWORD: ${POSTGRES_PASSWORD:-${YOGIMANGCHI_DB_PASSWORD}}
      YOGIMANGCHI_REDIS_HOST: "redis"
      YOGIMANGCHI_REDIS_PORT: "6379"
      YOGIMANGCHI_REDIS_PASSWORD: ${YOGIMANGCHI_REDIS_PASSWORD:-}
      # 회원 RS256 공개키 검증 & 도메인/CORS/WebSocket 허용
      TRADING_MEMBER_AUTH_ENABLED: "true"
      YOGIMANGCHI_JWT_ISSUER: ${YOGIMANGCHI_JWT_ISSUER:-https://yogimangchi.com}
      TRADING_JWT_PUBLIC_KEY_PATH: "/run/secrets/content-public.pem"
      TRADING_HTTP_ALLOWED_ORIGINS: ${TRADING_HTTP_ALLOWED_ORIGINS:-https://yogimangchi.com,https://www.yogimangchi.com}
      TRADING_WS_ALLOWED_ORIGINS: ${TRADING_WS_ALLOWED_ORIGINS:-https://yogimangchi.com,https://www.yogimangchi.com}
      # 선택 운영 웹훅 알림 (비워두면 꺼짐 · 0원)
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_COOLDOWN_SECONDS: ${OPS_ALERT_COOLDOWN_SECONDS:-300}
      OPS_ALERT_TELEGRAM_CHAT_ID: ${OPS_ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./secrets:/run/secrets:ro
      - ./logs/trading:/var/log/yogimangchi
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - yogimangchi-net

  # 5. Next.js 16.4.6 Frontend (Web, 3000)
  web:
    image: ${FRONTEND_IMAGE:-622532143961.dkr.ecr.ap-northeast-2.amazonaws.com/yogimangchi-client:v2}
    container_name: yogimangchi-client-v2
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      # SSR / Route Handler 내부 통신 (Docker 내부망 직통 -> CloudFront 왕복 없음)
      CONTENT_API_BASE_URL: "http://content-server:8080"
      TRADING_API_BASE_URL: "http://trading-server:8081"
      # 브라우저 공개 주소 (동일 도메인 -> CORS/쿠키 문제 없음)
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://yogimangchi.com}
      NEXT_PUBLIC_CONTENT_SERVER_URL: ${NEXT_PUBLIC_CONTENT_SERVER_URL:-https://yogimangchi.com}
      NEXT_PUBLIC_TRADING_SERVER_URL: ${NEXT_PUBLIC_TRADING_SERVER_URL:-https://yogimangchi.com}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      content-server:
        condition: service_healthy
      trading-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - yogimangchi-net

  # 6. Nginx 리버스 프록시 (CloudFront -> EC2 :80 단일 진입점; 8080/8081 외부 개방 불필요)
  nginx:
    image: nginx:1.27-alpine
    container_name: yogimangchi-nginx
    restart: unless-stopped
    mem_limit: 96m
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      web:
        condition: service_healthy
      content-server:
        condition: service_healthy
      trading-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - yogimangchi-net

networks:
  yogimangchi-net:
    driver: bridge
